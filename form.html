<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WDD 131 – Product Review Form – Emmanuel Adams</title>
  <meta name="description" content="Product review submission form for WDD 131 – Dynamic Web Fundamentals, built by Emmanuel Adams.">
  <meta name="author" content="Emmanuel Adams">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/form.css">
  <script src="scripts/form.js" defer></script>
</head>
<body>

  <header>
    <h1>Product Review</h1>
  </header>

  <main>
    <form action="review.html" method="get">

      <div class="field">
        <label for="product">Product Name</label>
        <select id="product" name="product" required>
          <option value="" disabled selected>Select a Product ...</option>
        </select>
      </div>

      <fieldset class="field rating-field">
        <legend>Overall Rating</legend>
        <div class="rating">
          <label for="rating1">&star;</label>
          <label for="rating2">&star;&star;</label>
          <label for="rating3">&star;&star;&star;</label>
          <label for="rating4">&star;&star;&star;&star;</label>
          <label for="rating5">&star;&star;&star;&star;&star;</label>

          <input type="radio" id="rating1" name="rating" value="1" required>
          <input type="radio" id="rating2" name="rating" value="2" required>
          <input type="radio" id="rating3" name="rating" value="3" required>
          <input type="radio" id="rating4" name="rating" value="4" required>
          <input type="radio" id="rating5" name="rating" value="5" required>
        </div>
      </fieldset>

      <div class="field">
        <label for="installDate">Date of Installation</label>
        <input type="date" id="installDate" name="installDate" required>
      </div>

      <fieldset class="field">
        <legend>Which features did you find useful in the product? <em>(Check all that apply)</em></legend>

        <div class="checkbox-row">
          <input type="checkbox" id="durability" name="features" value="durability">
          <label for="durability">Durability</label>
        </div>

        <div class="checkbox-row">
          <input type="checkbox" id="easeOfUse" name="features" value="ease of use">
          <label for="easeOfUse">Ease of Use</label>
        </div>

        <div class="checkbox-row">
          <input type="checkbox" id="performance" name="features" value="performance">
          <label for="performance">Performance</label>
        </div>

        <div class="checkbox-row">
          <input type="checkbox" id="design" name="features" value="design">
          <label for="design">Design</label>
        </div>
      </fieldset>

      <div class="field">
        <label for="review">Written Review <span class="optional">(Optional)</span></label>
        <textarea id="review" name="review" rows="5"></textarea>
      </div>

      <div class="field">
        <label for="username">Your Name <span class="optional">(Optional)</span></label>
        <input type="text" id="username" name="username">
      </div>

      <div class="field submit-field">
        <input type="submit" value="Post Review">
      </div>

    </form>
  </main>

  <footer>
    <p>&copy; <span id="currentyear"></span> Emmanuel Adams, Ghana</p>
    <p id="lastModified"></p>
  </footer>

</body>
</html>
